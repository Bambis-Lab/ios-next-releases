name: IOSNext

options:
  minimumXcodeGenVersion: 2.38.0

settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: 27.0
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: de.nicofroeba16.iosnext

targets:
  IOSNext:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.1.1
        CURRENT_PROJECT_VERSION: 14
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) IOSNEXT_FREE_SIDELOAD"
        INFOPLIST_KEY_CFBundleDisplayName: iOS Next
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: iOS Next connects to your Home Assistant server on the local network.
        INFOPLIST_KEY_NSFaceIDUsageDescription: iOS Next uses Face ID to confirm critical runner and owner actions.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: iOS Next uses the microphone for voice messages and the locally enabled Jarvis voice mode.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: iOS Next uses on-device iOS speech recognition for the Jarvis wake word and subsequent voice commands when local recognition is available.
        INFOPLIST_KEY_NSCameraUsageDescription: iOS Next uses the camera for photos encrypted directly from memory.
    scheme:
      testTargets:
        - IOSNextTests
  IOSNextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: IOSNext
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.nicofroeba16.iosnext.tests
