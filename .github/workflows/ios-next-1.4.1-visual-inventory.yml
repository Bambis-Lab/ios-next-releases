name: iOS Next 1.4.1 — Complete Visual Inventory

on:
  push:
    branches:
      - audit/ios-next-1.4.1-visual-inventory
    paths:
      - ".github/workflows/ios-next-1.4.1-visual-inventory.yml"
      - "audit/VisualInventoryUITests.swift"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-next-1.4.1-visual-inventory
  cancel-in-progress: true

jobs:
  visual-inventory:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BUILD_REPOSITORY: Bambis-Lab/ios-next-build
      BUILD_SHA: 75f127ddf27f620855ec190bd0282b69aad61401
      DEVICE_NAME: iPhone 18 Pro Max
      SCHEME: IOSNext
      OUT_NAME: ios-next-visual-inventory

    steps:
      - name: Checkout audit harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/ios-next-1.4.1-visual-inventory
          fetch-depth: 1

      - name: Checkout exact public 1.4.1 build source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.BUILD_REPOSITORY }}
          ref: ${{ env.BUILD_SHA }}
          path: build-source
          fetch-depth: 1

      - name: Prepare lightweight app and UI-test project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$OUT_NAME"
          mkdir -p "$OUT/screenshots" "$OUT/logs"

          test "$(git -C build-source rev-parse HEAD)" = "$BUILD_SHA"
          grep -q 'MARKETING_VERSION: 1.4.1' build-source/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 21' build-source/project.yml

          cp audit/VisualInventoryUITests.swift build-source/UITests/VisualInventoryUITests.swift

          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

          cd build-source
          python3 - <<'PY'
          from pathlib import Path
          src = Path("project.yml").read_text()

          packages = """packages:
            WireGuardKit:
              path: .build-dependencies/wireguard-apple
          """
          src = src.replace(packages, "")

          app_dep = """    dependencies:
                - target: IOSNextPacketTunnel
                  embed: true
                  link: false
          """
          src = src.replace(app_dep, "")

          start = src.index("  WireGuardGoBridgeiOS:")
          end = src.index("  IOSNextTests:")
          src = src[:start] + src[end:]

          src = src.replace(
              "        CODE_SIGN_ENTITLEMENTS: Sources/Resources/IOSNext.entitlements\n",
              "        CODE_SIGN_ENTITLEMENTS: \"\"\n"
              "        SWIFT_ACTIVE_COMPILATION_CONDITIONS: \"$(inherited) IOSNEXT_FREE_SIDELOAD\"\n",
              1,
          )

          Path("project.visual.yml").write_text(src)
          PY

          xcodegen generate --spec project.visual.yml
          test -f IOSNext.xcodeproj/project.pbxproj
          ! grep -q 'WireGuardGoBridgeiOS' IOSNext.xcodeproj/project.pbxproj
          ! grep -q 'IOSNextPacketTunnel' IOSNext.xcodeproj/project.pbxproj

      - name: Start simulator boot
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(r["identifier"] for r in d["runtimes"] if r.get("isAvailable",True) and r.get("name")=="iOS 27.0"))')"
          device_type_id="$(DEVICE_NAME="$DEVICE_NAME" xcrun simctl list devicetypes -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); n=os.environ["DEVICE_NAME"]; print(next(x["identifier"] for x in d["devicetypes"] if x.get("name")==n))')"
          SIM_UDID="$(xcrun simctl create "$DEVICE_NAME Visual Inventory" "$device_type_id" "$runtime_id")"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true

      - name: Build UI-test product
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/ios-next-visual-derived"
          DESTINATION="platform=iOS Simulator,id=$SIM_UDID"
          echo "DERIVED=$DERIVED" >> "$GITHUB_ENV"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

          xcodebuild build-for-testing             -project IOSNext.xcodeproj             -scheme "$SCHEME"             -derivedDataPath "$DERIVED"             -destination "$DESTINATION"             CODE_SIGNING_ALLOWED=NO             ONLY_ACTIVE_ARCH=YES             COMPILER_INDEX_STORE_ENABLE=NO             | tee "$RUNNER_TEMP/$OUT_NAME/logs/build-for-testing.log"

          XCTESTRUN_PATH="$(find "$DERIVED/Build/Products" -name '*.xctestrun' -print -quit)"
          test -f "$XCTESTRUN_PATH"
          echo "XCTESTRUN_PATH=$XCTESTRUN_PATH" >> "$GITHUB_ENV"

      - name: Capture visual inventory in parallel
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$OUT_NAME"
          xcrun simctl bootstatus "$SIM_UDID" -b

          rm -rf "$OUT/VisualInventory.xcresult" "$OUT/screenshots"
          mkdir -p "$OUT/screenshots"

          xcodebuild test-without-building             -xctestrun "$XCTESTRUN_PATH"             -destination "$DESTINATION"             -only-testing:IOSNextUITests/VisualInventoryUITests             -parallel-testing-enabled YES             -maximum-parallel-testing-workers 5             -resultBundlePath "$OUT/VisualInventory.xcresult"             | tee "$OUT/logs/visual-inventory.log"

          xcrun xcresulttool export attachments             --path "$OUT/VisualInventory.xcresult"             --output-path "$OUT/screenshots"             | tee "$OUT/logs/xcresult-export.log"

          find "$OUT/screenshots" -type f -name '*.png' -print | sort > "$OUT/screenshots/files.txt"
          count="$(wc -l < "$OUT/screenshots/files.txt" | tr -d ' ')"
          {
            echo "VISUAL_INVENTORY=PASS"
            echo "screenshot_count=$count"
            echo "parallel_workers=5"
            echo "wireguard_in_test_graph=false"
            echo "build_sha=$BUILD_SHA"
          } | tee "$OUT/summary.txt"

          test "$count" -ge 25
          rm -rf "$OUT/VisualInventory.xcresult"

      - name: Build HTML visual index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / os.environ["OUT_NAME"]
          shots = sorted((root / "screenshots").glob("*.png"))
          cards = []
          for p in shots:
              cards.append(
                  f'<figure><img src="screenshots/{html.escape(p.name)}">'
                  f'<figcaption>{html.escape(p.name)}</figcaption></figure>'
              )
          doc = """<!doctype html><meta charset="utf-8">
          <title>iOS Next 1.4.1 Visual Inventory</title>
          <style>
          body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#eee;margin:24px}
          main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
          figure{margin:0;background:#1b1b1d;padding:10px;border-radius:16px}
          img{width:100%;height:auto;border-radius:10px}
          figcaption{font-size:12px;word-break:break-word;margin-top:8px}
          </style><h1>iOS Next 1.4.1 Visual Inventory</h1><main>""" + "".join(cards) + "</main>"
          (root / "index.html").write_text(doc)
          PY

      - name: Upload visual inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-next-1.4.1-complete-visual-inventory
          retention-days: 14
          if-no-files-found: warn
          compression-level: 3
          path: |
            ${{ runner.temp }}/ios-next-visual-inventory/screenshots
            ${{ runner.temp }}/ios-next-visual-inventory/logs
            ${{ runner.temp }}/ios-next-visual-inventory/summary.txt
            ${{ runner.temp }}/ios-next-visual-inventory/index.html

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
            xcrun simctl delete "$SIM_UDID" 2>/dev/null || true
          fi
