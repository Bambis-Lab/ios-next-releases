name: iOS Next 1.4.1 — Complete Visual Inventory

on:
  push:
    branches:
      - audit/ios-next-1.4.1-visual-inventory
    paths:
      - ".github/workflows/ios-next-1.4.1-visual-inventory.yml"
      - "audit/VisualInventoryUITests.swift"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-next-1.4.1-visual-inventory
  cancel-in-progress: true

jobs:
  visual-inventory:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BUILD_REPOSITORY: Bambis-Lab/ios-next-build
      BUILD_SHA: 75f127ddf27f620855ec190bd0282b69aad61401
      DEVICE_NAME: iPhone 18 Pro Max
      SCHEME: IOSNext
      OUT_NAME: ios-next-visual-inventory

    steps:
      - name: Checkout audit harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/ios-next-1.4.1-visual-inventory
          fetch-depth: 1

      - name: Checkout exact public 1.4.1 build source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.BUILD_REPOSITORY }}
          ref: ${{ env.BUILD_SHA }}
          path: build-source
          fetch-depth: 1

      - name: Prepare lightweight app and UI-test project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$OUT_NAME"
          mkdir -p "$OUT/screenshots" "$OUT/logs"

          test "$(git -C build-source rev-parse HEAD)" = "$BUILD_SHA"
          grep -q 'MARKETING_VERSION: 1.4.1' build-source/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 21' build-source/project.yml

          cp audit/VisualInventoryUITests.swift build-source/UITests/VisualInventoryUITests.swift

          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

          cd build-source
          python3 - <<'PY'
          from pathlib import Path
          src = Path("project.yml").read_text()

          packages = """packages:
            WireGuardKit:
              path: .build-dependencies/wireguard-apple
          """
          src = src.replace(packages, "")

          app_dep = """    dependencies:
                - target: IOSNextPacketTunnel
                  embed: true
                  link: false
          """
          src = src.replace(app_dep, "")

          start = src.index("  WireGuardGoBridgeiOS:")
          end = src.index("  IOSNextTests:")
          src = src[:start] + src[end:]

          src = src.replace(
              "        CODE_SIGN_ENTITLEMENTS: Sources/Resources/IOSNext.entitlements\n",
              "        CODE_SIGN_ENTITLEMENTS: \"\"\n"
              "        SWIFT_ACTIVE_COMPILATION_CONDITIONS: \"$(inherited) IOSNEXT_FREE_SIDELOAD\"\n",
              1,
          )

          Path("project.visual.yml").write_text(src)
          PY

          xcodegen generate --spec project.visual.yml
          test -f IOSNext.xcodeproj/project.pbxproj
          ! grep -q 'WireGuardGoBridgeiOS' IOSNext.xcodeproj/project.pbxproj
          ! grep -q 'IOSNextPacketTunnel' IOSNext.xcodeproj/project.pbxproj

      - name: Start simulator boot
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(r["identifier"] for r in d["runtimes"] if r.get("isAvailable",True) and r.get("name")=="iOS 27.0"))')"
          device_type_id="$(DEVICE_NAME="$DEVICE_NAME" xcrun simctl list devicetypes -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); n=os.environ["DEVICE_NAME"]; print(next(x["identifier"] for x in d["devicetypes"] if x.get("name")==n))')"
          SIM_UDID="$(xcrun simctl create "$DEVICE_NAME Visual Inventory" "$device_type_id" "$runtime_id")"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true

      - name: Build UI-test product
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/ios-next-visual-derived"
          DESTINATION="platform=iOS Simulator,id=$SIM_UDID"
          echo "DERIVED=$DERIVED" >> "$GITHUB_ENV"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

          xcodebuild build-for-testing             -project IOSNext.xcodeproj             -scheme "$SCHEME"             -derivedDataPath "$DERIVED"             -destination "$DESTINATION"             CODE_SIGNING_ALLOWED=NO             ONLY_ACTIVE_ARCH=YES             COMPILER_INDEX_STORE_ENABLE=NO             | tee "$RUNNER_TEMP/$OUT_NAME/logs/build-for-testing.log"

          XCTESTRUN_PATH="$(find "$DERIVED/Build/Products" -name '*.xctestrun' -print -quit)"
          test -f "$XCTESTRUN_PATH"
          echo "XCTESTRUN_PATH=$XCTESTRUN_PATH" >> "$GITHUB_ENV"

      - name: Capture direct static surfaces
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$OUT_NAME"
          APP_ID="de.nicofroeba16.iosnext"
          APP_PATH="$DERIVED/Build/Products/Debug-iphonesimulator/IOSNext.app"

          xcrun simctl bootstatus "$SIM_UDID" -b
          test -d "$APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          capture_product() {
            screen="$1"
            appearance="$2"
            out="$OUT/screenshots/catalog-$appearance-$screen.png"

            xcrun simctl ui "$SIM_UDID" appearance "$appearance"
            xcrun simctl terminate "$SIM_UDID" "$APP_ID" 2>/dev/null || true

            if [ "$appearance" = "dark" ]; then
              xcrun simctl launch "$SIM_UDID" "$APP_ID" "--product-ui-test-screen=$screen" --product-ui-test-dark >/dev/null
            else
              xcrun simctl launch "$SIM_UDID" "$APP_ID" "--product-ui-test-screen=$screen" >/dev/null
            fi

            sleep 0.65
            xcrun simctl io "$SIM_UDID" screenshot "$out" >/dev/null
          }

          for screen in home rooms chat media system light media-detail owner; do
            capture_product "$screen" dark
          done

          for screen in home rooms chat media system light media-detail owner; do
            capture_product "$screen" light
          done

          for appearance in dark light; do
            xcrun simctl ui "$SIM_UDID" appearance "$appearance"
            for page in 0 1 2; do
            xcrun simctl terminate "$SIM_UDID" "$APP_ID" 2>/dev/null || true
            xcrun simctl launch "$SIM_UDID" "$APP_ID" --live-card-test-mode "--live-card-page=$page" >/dev/null
            sleep 0.65
            number=$((page + 1))
            xcrun simctl io "$SIM_UDID" screenshot "$OUT/screenshots/cards-$appearance-page-$number.png" >/dev/null
            done
          done

          echo "direct_static_count=$(find "$OUT/screenshots" -name '*.png' | wc -l | tr -d ' ')"             | tee "$OUT/logs/direct-capture.log"

      - name: Capture interactive menus and sliders with bounded diagnostics
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$OUT_NAME"
          rm -rf "$OUT/Interactive.xcresult" "$OUT/interactive-attachments"

          # Xcode 27 can hang for 600 seconds AFTER all UI tests pass while
          # collecting simulator diagnostics. Preserve the xcodebuild log and
          # bound that post-suite phase; never convert test failures to PASS.
          python3 - <<'PY'
          import os, pathlib, re, signal, subprocess, time
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / os.environ["OUT_NAME"]
          log = out / "logs/interactive-inventory.log"
          cmd = ["xcodebuild", "test-without-building",
                 "-xctestrun", os.environ["XCTESTRUN_PATH"],
                 "-destination", os.environ["DESTINATION"],
                 "-only-testing:IOSNextUITests/VisualInventoryUITests",
                 "-parallel-testing-enabled", "NO",
                 "-resultBundlePath", str(out / "Interactive.xcresult")]
          with log.open("w") as dest:
              proc = subprocess.Popen(cmd, stdout=dest, stderr=subprocess.STDOUT,
                                      start_new_session=True)
              passed_at = None
              deadline = time.monotonic() + 900
              while proc.poll() is None:
                  content = log.read_text(errors="replace")
                  # The actual XCTest suite must finish successfully (not
                  # merely print a partial test-case success line).
                  passed = ("Test Suite 'Selected tests' passed" in content and
                            re.search(r"Executed 5 tests, with 0 failures", content))
                  if passed and passed_at is None:
                      passed_at = time.monotonic()
                  if (passed_at is not None and time.monotonic()-passed_at > 25) or time.monotonic() > deadline:
                      os.killpg(proc.pid, signal.SIGTERM)
                      try: proc.wait(timeout=8)
                      except subprocess.TimeoutExpired:
                          os.killpg(proc.pid, signal.SIGKILL)
                          proc.wait()
                      break
                  time.sleep(2)
          content = log.read_text(errors="replace")
          suite_pass = ("Test Suite 'Selected tests' passed" in content and
                        re.search(r"Executed 5 tests, with 0 failures", content))
          (out / "logs/test-exit.txt").write_text(
              f"xcodebuild_exit={proc.returncode}\\nsuite_pass={bool(suite_pass)}\\n"
          )
          if not suite_pass:
              raise SystemExit("UI suite did not pass (see interactive-inventory.log)")
          PY

          mkdir -p "$OUT/interactive-attachments"
          # Xcode may not have finalized the xcresult bundle if diagnostics
          # were interrupted. Export errors are recorded, not concealed.
          if test -d "$OUT/Interactive.xcresult"; then
            xcrun xcresulttool export attachments --path "$OUT/Interactive.xcresult" --output-path "$OUT/interactive-attachments" > "$OUT/logs/xcresult-export.log" 2>&1 || true
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil
          root = Path(os.environ["RUNNER_TEMP"]) / os.environ["OUT_NAME"]
          sources = sorted((root / "interactive-attachments").rglob("*.png"))
          for index, p in enumerate(sources, 1):
              target = root / "screenshots" / f"interactive-{index:03d}-{p.stem}.png"
              shutil.copy2(p, target)
          shots = sorted((root / "screenshots").glob("*.png"))
          (root / "screenshots/files.txt").write_text("".join(f"{p.name}  {hashlib.sha256(p.read_bytes()).hexdigest()}\\n" for p in shots))
          static = len([p for p in shots if not p.name.startswith("interactive-")])
          interactive = len(shots) - static
          summary = (f"VISUAL_INVENTORY={'PASS' if static >= 22 and interactive >= 3 else 'INCOMPLETE'}\\n"
                     f"screenshot_count={len(shots)}\\nstatic_count={static}\\n"
                     f"interactive_count={interactive}\\n"
                     "parallel_workers=1\\nstatic_capture=simctl\\n"
                     "interactive_capture=xcuitest\\n"
                     "wireguard_in_test_graph=false\\n"
                     f"build_sha={os.environ['BUILD_SHA']}\\n")
          (root / "summary.txt").write_text(summary)
          print(summary)
          if static < 22 or interactive < 3 or len(shots) < 25:
              raise SystemExit("Capture matrix incomplete; inspect screenshot files and export logs")
          PY
          rm -rf "$OUT/Interactive.xcresult"

      - name: Build HTML visual index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / os.environ["OUT_NAME"]
          shots = sorted((root / "screenshots").glob("*.png"))
          cards = []
          for p in shots:
              cards.append(
                  f'<figure><img src="screenshots/{html.escape(p.name)}">'
                  f'<figcaption>{html.escape(p.name)}</figcaption></figure>'
              )
          doc = """<!doctype html><meta charset="utf-8">
          <title>iOS Next 1.4.1 Visual Inventory</title>
          <style>
          body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#eee;margin:24px}
          main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
          figure{margin:0;background:#1b1b1d;padding:10px;border-radius:16px}
          img{width:100%;height:auto;border-radius:10px}
          figcaption{font-size:12px;word-break:break-word;margin-top:8px}
          </style><h1>iOS Next 1.4.1 Visual Inventory</h1><main>""" + "".join(cards) + "</main>"
          (root / "index.html").write_text(doc)
          PY

      - name: Upload visual inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-next-1.4.1-complete-visual-inventory
          retention-days: 14
          if-no-files-found: warn
          compression-level: 3
          path: |
            ${{ runner.temp }}/ios-next-visual-inventory/screenshots
            ${{ runner.temp }}/ios-next-visual-inventory/logs
            ${{ runner.temp }}/ios-next-visual-inventory/summary.txt
            ${{ runner.temp }}/ios-next-visual-inventory/index.html

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
            xcrun simctl delete "$SIM_UDID" 2>/dev/null || true
          fi
