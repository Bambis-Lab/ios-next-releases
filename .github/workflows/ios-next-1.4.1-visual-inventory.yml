name: iOS Next 1.4.1 — Complete Visual Inventory

on:
  push:
    branches:
      - audit/ios-next-1.4.1-visual-inventory
    paths:
      - ".github/workflows/ios-next-1.4.1-visual-inventory.yml"
      - "audit/VisualInventoryUITests.swift"
      - "audit/validate_visual_pngs.swift"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-next-1.4.1-visual-inventory
  cancel-in-progress: true

jobs:
  visual-inventory:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BUILD_REPOSITORY: Bambis-Lab/ios-next-build
      BUILD_SHA: 75f127ddf27f620855ec190bd0282b69aad61401
      DEVICE_NAME: iPhone 18 Pro Max
      SCHEME: IOSNext
      OUT_NAME: ios-next-visual-inventory

    steps:
      - name: Checkout audit harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/ios-next-1.4.1-visual-inventory
          fetch-depth: 1

      - name: Checkout exact public 1.4.1 build source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.BUILD_REPOSITORY }}
          ref: ${{ env.BUILD_SHA }}
          path: build-source
          fetch-depth: 1

      - name: Prepare lightweight app and UI-test project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$OUT_NAME"
          mkdir -p "$OUT/screenshots" "$OUT/logs"

          test "$(git -C build-source rev-parse HEAD)" = "$BUILD_SHA"
          grep -q 'MARKETING_VERSION: 1.4.1' build-source/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 21' build-source/project.yml

          cp audit/VisualInventoryUITests.swift build-source/UITests/VisualInventoryUITests.swift

          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

          cd build-source
          python3 - <<'PY'
          from pathlib import Path
          src = Path("project.yml").read_text()

          packages = """packages:
            WireGuardKit:
              path: .build-dependencies/wireguard-apple
          """
          src = src.replace(packages, "")

          app_dep = """    dependencies:
                - target: IOSNextPacketTunnel
                  embed: true
                  link: false
          """
          src = src.replace(app_dep, "")

          start = src.index("  WireGuardGoBridgeiOS:")
          end = src.index("  IOSNextTests:")
          src = src[:start] + src[end:]

          src = src.replace(
              "        CODE_SIGN_ENTITLEMENTS: Sources/Resources/IOSNext.entitlements\n",
              "        CODE_SIGN_ENTITLEMENTS: \"\"\n"
              "        SWIFT_ACTIVE_COMPILATION_CONDITIONS: \"$(inherited) IOSNEXT_FREE_SIDELOAD\"\n",
              1,
          )

          Path("project.visual.yml").write_text(src)
          PY

          xcodegen generate --spec project.visual.yml
          test -f IOSNext.xcodeproj/project.pbxproj
          ! grep -q 'WireGuardGoBridgeiOS' IOSNext.xcodeproj/project.pbxproj
          ! grep -q 'IOSNextPacketTunnel' IOSNext.xcodeproj/project.pbxproj

      - name: Start simulator boot
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(r["identifier"] for r in d["runtimes"] if r.get("isAvailable",True) and r.get("name")=="iOS 27.0"))')"
          device_type_id="$(DEVICE_NAME="$DEVICE_NAME" xcrun simctl list devicetypes -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); n=os.environ["DEVICE_NAME"]; print(next(x["identifier"] for x in d["devicetypes"] if x.get("name")==n))')"
          SIM_UDID="$(xcrun simctl create "$DEVICE_NAME Visual Inventory" "$device_type_id" "$runtime_id")"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true

      - name: Build UI-test product
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/ios-next-visual-derived"
          DESTINATION="platform=iOS Simulator,id=$SIM_UDID"
          echo "DERIVED=$DERIVED" >> "$GITHUB_ENV"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

          xcodebuild build-for-testing             -project IOSNext.xcodeproj             -scheme "$SCHEME"             -derivedDataPath "$DERIVED"             -destination "$DESTINATION"             CODE_SIGNING_ALLOWED=NO             ONLY_ACTIVE_ARCH=YES             COMPILER_INDEX_STORE_ENABLE=NO             | tee "$RUNNER_TEMP/$OUT_NAME/logs/build-for-testing.log"

          XCTESTRUN_PATH="$(find "$DERIVED/Build/Products" -name '*.xctestrun' -print -quit)"
          test -f "$XCTESTRUN_PATH"
          echo "XCTESTRUN_PATH=$XCTESTRUN_PATH" >> "$GITHUB_ENV"

      - name: Capture direct static surfaces
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$OUT_NAME"
          APP_ID="de.nicofroeba16.iosnext"
          APP_PATH="$DERIVED/Build/Products/Debug-iphonesimulator/IOSNext.app"
          xcrun simctl bootstatus "$SIM_UDID" -b
          test -d "$APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          DATA_DIR="$(xcrun simctl get_app_container "$SIM_UDID" "$APP_ID" data)"
          test -d "$DATA_DIR/tmp"

          wait_for_ready() {
            marker="$1"
            for attempt in $(seq 1 90); do
              if test -s "$marker"; then cat "$marker"; return 0; fi
              sleep 0.4
            done
            echo "::error::Render-ready marker absent: $marker"
            return 1
          }

          capture_product() {
            screen="$1"
            appearance="$2"
            nonce="$GITHUB_RUN_ID-$appearance-$screen"
            marker="$DATA_DIR/tmp/iosnext-product-screen-ready-$screen-$appearance-$nonce"
            out="$OUT/screenshots/catalog-$appearance-$screen.png"
            xcrun simctl ui "$SIM_UDID" appearance "$appearance"
            xcrun simctl terminate "$SIM_UDID" "$APP_ID" 2>/dev/null || true
            rm -f "$marker"
            if [ "$appearance" = "dark" ]; then
              xcrun simctl launch "$SIM_UDID" "$APP_ID" "--product-ui-test-screen=$screen" --product-ui-test-dark "--visual-ready-nonce=$nonce"
            else
              xcrun simctl launch "$SIM_UDID" "$APP_ID" "--product-ui-test-screen=$screen" "--visual-ready-nonce=$nonce"
            fi
            wait_for_ready "$marker"
            xcrun simctl io "$SIM_UDID" screenshot "$out"
            test -s "$out"
          }

          for appearance in dark light; do
            for screen in home rooms chat media system light media-detail owner; do
              capture_product "$screen" "$appearance"
            done
          done

          for appearance in dark light; do
            xcrun simctl ui "$SIM_UDID" appearance "$appearance"
            for page in 0 1 2; do
              nonce="$GITHUB_RUN_ID-$appearance-card-$page"
              marker="$DATA_DIR/tmp/iosnext-live-card-ready-$page-$nonce"
              number=$((page + 1))
              xcrun simctl terminate "$SIM_UDID" "$APP_ID" 2>/dev/null || true
              rm -f "$marker"
              xcrun simctl launch "$SIM_UDID" "$APP_ID" --live-card-test-mode "--live-card-page=$page" "--visual-ready-nonce=$nonce"
              wait_for_ready "$marker"
              xcrun simctl io "$SIM_UDID" screenshot "$OUT/screenshots/cards-$appearance-page-$number.png"
            done
          done

          echo "direct_static_count=$(find "$OUT/screenshots" -name '*.png' | wc -l | tr -d ' ')" | tee "$OUT/logs/direct-capture.log"
          swift ../audit/validate_visual_pngs.swift "$OUT"/screenshots/*.png | tee "$OUT/logs/static-content-validation.log"

      - name: Capture interactive menus and sliders with complete XCResult
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$OUT_NAME"
          rm -rf "$OUT/Interactive.xcresult" "$OUT/interactive-attachments"
          # Xcode 27: disable sysdiagnose; allow xcodebuild to finalize xcresult.
          set +e
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_PATH" \
            -destination "$DESTINATION" \
            -only-testing:IOSNextUITests/VisualInventoryUITests \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -resultBundlePath "$OUT/Interactive.xcresult" \
            > "$OUT/logs/interactive-inventory.log" 2>&1
          test_exit=$?
          set -e
          cat "$OUT/logs/interactive-inventory.log"
          printf 'xcodebuild_exit=%s\n' "$test_exit" > "$OUT/logs/test-exit.txt"

          mkdir -p "$OUT/interactive-attachments"
          export_exit=0
          if test -f "$OUT/Interactive.xcresult/Info.plist"; then
            xcrun xcresulttool export attachments \
              --path "$OUT/Interactive.xcresult" \
              --output-path "$OUT/interactive-attachments" \
              > "$OUT/logs/xcresult-export.log" 2>&1 || export_exit=$?
          else
            echo 'XCRESULT_NOT_FINALIZED: Info.plist absent' > "$OUT/logs/xcresult-export.log"
            export_exit=1
          fi
          cat "$OUT/logs/xcresult-export.log"
          echo "xcresult_export_exit=$export_exit" >> "$OUT/logs/test-exit.txt"

          python3 - <<'PY'
          import hashlib, os, pathlib, re, shutil
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / os.environ["OUT_NAME"]
          log = (root / "logs/xcresult-export.log").read_text(errors="replace")
          mapping = re.findall(r'File:\s*([^,\s]+),\s*suggested name:\s*"([^"]+)"', log)
          seen = set()
          for source_name, suggested_name in mapping:
              original = root / "interactive-attachments" / source_name
              if not original.is_file(): raise SystemExit(f"Missing attachment {source_name}")
              match = re.fullmatch(r'VISUAL-INVENTORY--(.+?)_0_[0-9A-Fa-f-]+\.png', suggested_name)
              if not match: raise SystemExit(f"Unexpected attachment: {suggested_name}")
              name = match.group(1)
              if name in seen: raise SystemExit(f"Duplicate attachment name: {name}")
              seen.add(name)
              shutil.copy2(original, root / "screenshots" / f"interactive-{name}.png")

          shots = sorted((root / "screenshots").glob("*.png"))
          (root / "screenshots/files.txt").write_text(
              "".join(f"{p.name}  {hashlib.sha256(p.read_bytes()).hexdigest()}\n" for p in shots))
          static = sum(not p.name.startswith("interactive-") for p in shots)
          interactive = len(shots) - static
          required = {
              "interactive-landing.png", "interactive-setup-home-assistant.png",
              "interactive-slider-light-before.png", "interactive-slider-media-detail-before.png",
          }
          missing = sorted(required - {p.name for p in shots})
          tests = (root / "logs/interactive-inventory.log").read_text(errors="replace")
          suite_pass = ("Test Suite 'Selected tests' passed" in tests and
                        re.search(r'Executed 5 tests, with 0 failures', tests) is not None)
          complete = suite_pass and static == 22 and interactive >= 3 and not missing
          summary = "\n".join([
              f"VISUAL_INVENTORY={'PASS' if complete else 'INCOMPLETE'}",
              f"screenshot_count={len(shots)}", f"static_count={static}",
              f"interactive_count={interactive}", f"suite_pass={suite_pass}",
              f"missing_required_attachments={','.join(missing)}",
              "parallel_workers=1", "static_capture=simctl",
              "interactive_capture=xcuitest", "wireguard_in_test_graph=false",
              f"build_sha={os.environ['BUILD_SHA']}",
          ]) + "\n"
          (root / "summary.txt").write_text(summary)
          print(summary)
          if not complete: raise SystemExit("Incomplete UI or attachment capture; see logs")
          PY

          swift ../audit/validate_visual_pngs.swift "$OUT"/screenshots/*.png | tee "$OUT/logs/all-content-validation.log"
          test "$export_exit" -eq 0
          test "$test_exit" -eq 0
          rm -rf "$OUT/Interactive.xcresult"

      - name: Build HTML visual index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / os.environ["OUT_NAME"]
          shots = sorted((root / "screenshots").glob("*.png"))
          cards = []
          for p in shots:
              cards.append(
                  f'<figure><img src="screenshots/{html.escape(p.name)}">'
                  f'<figcaption>{html.escape(p.name)}</figcaption></figure>'
              )
          doc = """<!doctype html><meta charset="utf-8">
          <title>iOS Next 1.4.1 Visual Inventory</title>
          <style>
          body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#eee;margin:24px}
          main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
          figure{margin:0;background:#1b1b1d;padding:10px;border-radius:16px}
          img{width:100%;height:auto;border-radius:10px}
          figcaption{font-size:12px;word-break:break-word;margin-top:8px}
          </style><h1>iOS Next 1.4.1 Visual Inventory</h1><main>""" + "".join(cards) + "</main>"
          (root / "index.html").write_text(doc)
          PY

      - name: Upload visual inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-next-1.4.1-complete-visual-inventory
          retention-days: 14
          if-no-files-found: warn
          compression-level: 3
          path: |
            ${{ runner.temp }}/ios-next-visual-inventory/screenshots
            ${{ runner.temp }}/ios-next-visual-inventory/logs
            ${{ runner.temp }}/ios-next-visual-inventory/summary.txt
            ${{ runner.temp }}/ios-next-visual-inventory/index.html

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
            xcrun simctl delete "$SIM_UDID" 2>/dev/null || true
          fi
