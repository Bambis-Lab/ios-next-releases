name: iOS Next — Xcode 27 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - build/ios-next-1.1.0-xcode27
    paths:
      - .github/workflows/build-ios-next-xcode27.yml

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: trigger one-shot Xcode 27 IPA build'
    runs-on: xcode-27-arm64

    steps:
      - name: Checkout prepared source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify Xcode 27
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -version | grep -q 'Xcode 27'

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate app-only project
        working-directory: build-source
        run: |
          set -euo pipefail
          xcodegen generate --spec project.public.yml

      - name: Build unsigned ARM64 Release app
        working-directory: build-source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/IOSNextDerived"
          xcodebuild \
            -project IOSNext.xcodeproj \
            -scheme IOSNext \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/IOSNextDerived" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Validate application
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/IOSNextDerived/Build/Products/Release-iphoneos/IOSNext.app"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          STYLE=$(/usr/libexec/PlistBuddy -c 'Print :UIUserInterfaceStyle' "$PLIST")
          test "$BUNDLE_ID" = "de.nicofroeba16.iosnext"
          test "$VERSION" = "1.1.0"
          test "$BUILD" = "13"
          test "$STYLE" = "Dark"
          file "$APP/IOSNext" | grep -q arm64
          if find "$APP" -type d -name '*.appex' | grep -q .; then
            echo "Unexpected app extension found"
            exit 1
          fi
          echo "APP_VALIDATION=PASS"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/IOSNextDerived/Build/Products/Release-iphoneos/IOSNext.app"
          OUT="$RUNNER_TEMP/ipa"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/"
          cd "$OUT"
          ditto -c -k --sequesterRsrc --keepParent Payload IOSNext-Free-unsigned.ipa
          test -s IOSNext-Free-unsigned.ipa
          shasum -a 256 IOSNext-Free-unsigned.ipa > IOSNext-Free-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IOSNext-Free-unsigned-IPA
          path: |
            ${{ runner.temp }}/ipa/IOSNext-Free-unsigned.ipa
            ${{ runner.temp }}/ipa/IOSNext-Free-unsigned.ipa.sha256
          if-no-files-found: error
