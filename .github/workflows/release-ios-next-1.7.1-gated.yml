name: iOS Next 1.7.1 Build 29 - Gated SideStore Publish
on:
  workflow_dispatch:
    inputs:
      acceptance_run:
        description: Successful real HA staging and full iPhone acceptance run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: ios-next-1.7.1-verified-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.acceptance_run }}
      APP_REPO: Bambis-Lab/ios-next-build
      BUILD_SHA: bcaedcdc622ea298e4dd20670f2b2c8aeabeacbe
      BACKEND_SHA: 47eda63a49f37ba21937d5ab9056852d60bc9b24
      VERSION: 1.7.1
      BUILD_NUMBER: '29'
      TAG: v1.7.1
      ASSET: IOSNext.ipa
    steps:
      - name: Checkout release repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Require exact source and successful real HA staging gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]{8,12}$ ]]
          test -f release-notes/1.7.1.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('source.json').read_text())
          versions = doc['apps'][0]['versions']
          assert doc['apps'][0]['bundleIdentifier'] == 'de.nicofroeba16.iosnext'
          assert versions[0]['version'] == '1.7.0' and versions[0]['buildVersion'] == '28'
          assert not any(v['version'] == '1.7.1' for v in versions)
          PY
          test "$(gh api "repos/$APP_REPO/actions/runs/$RUN_ID" --jq .status)" = completed
          test "$(gh api "repos/$APP_REPO/actions/runs/$RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$APP_REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$BUILD_SHA"
          gh api "repos/$APP_REPO/actions/runs/$RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/iosnext-171-jobs.json"
          python3 - "$RUNNER_TEMP/iosnext-171-jobs.json" <<'PY'
          import json,sys
          jobs=json.load(open(sys.argv[1]))['jobs']
          for name in ('source','full-unit-regression','iphone-simulator','full-g99-iphone','unsigned-rc-171'):
              matching=[j for j in jobs if j['name']==name]
              assert len(matching)==1 and matching[0]['conclusion']=='success', 'missing/failed gate '+name
          print('IOSNEXT_171_ALL_GATES=PASS')
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing overwrite"
            exit 1
          fi
      - name: Download and verify the exact gated unsigned iPhoneOS candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iosnext-171-out"
          gh run download "$RUN_ID" --repo "$APP_REPO"             --name IOSNext-1.7.1-build29-UNSIGNED-RC-NOT-PUBLISHED             --dir "$RUNNER_TEMP/iosnext-171-out"
          cd "$RUNNER_TEMP/iosnext-171-out"
          IPA=IOSNext-1.7.1-build29-UNSIGNED-RC.ipa
          test -s "$IPA"
          test -s SHA256SUMS.txt
          test -s provenance.txt
          grep -Fxq "source_sha=$BUILD_SHA" provenance.txt
          grep -Fxq "backend_sha=$BACKEND_SHA" provenance.txt
          grep -Fxq status=UNSIGNED_RC_NOT_PUBLISHED provenance.txt
          grep -Eq '^staging_evidence_sha256=[a-f0-9]{64}$' provenance.txt
          [[ "$(wc -l < SHA256SUMS.txt | tr -d '[:space:]')" == 1 ]]
          EXPECTED="$(awk 'NR==1 {print $1}' SHA256SUMS.txt)"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          test "$(shasum -a 256 "$IPA" | awk '{print $1}')" = "$EXPECTED"
          unzip -t "$IPA" >/dev/null
          if unzip -Z1 "$IPA" | grep -Eq '\.appex/'; then
            echo "::error::Unexpected iOS app extension in free-sideload IPA"
            exit 1
          fi
          unzip -p "$IPA" Payload/IOSNext.app/Info.plist > "$RUNNER_TEMP/iosnext171-info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/iosnext171-info.plist")" = de.nicofroeba16.iosnext
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/iosnext171-info.plist")" = 1.7.1
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/iosnext171-info.plist")" = 29
          BROKER="$("/usr/libexec/PlistBuddy" -c 'Print :IOSNextFamilyBrokerURL' "$RUNNER_TEMP/iosnext171-info.plist")"
          [[ "$BROKER" == https://* ]]
          unzip -p "$IPA" Payload/IOSNext.app/IOSNext > "$RUNNER_TEMP/iosnext171-binary"
          file "$RUNNER_TEMP/iosnext171-binary" | grep -q arm64
          mv "$IPA" IOSNext.ipa
          echo "IOSNEXT_171_UNSIGNED_IPA_VERIFIED=PASS"

      - name: Publish GitHub release then SideStore feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/iosnext-171-out/IOSNext.ipa"
          test -s "$IPA"
          gh release create "$TAG" "$IPA#$ASSET" \
            --title 'iOS Next 1.7.1 (Build 29)' \
            --notes-file release-notes/1.7.1.md \
            --target main
          PUBLISHED_AT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq .published_at)"
          SIZE="$(stat -f '%z' "$IPA")"
          SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET"
          python3 scripts/publish_version.py --version "$VERSION" --build-version "$BUILD_NUMBER" \
            --date "$PUBLISHED_AT" --download-url "$URL" --size "$SIZE" --min-os-version 27.0
          python3 - "$SIZE" "$SHA" "$PUBLISHED_AT" <<'PY'
          import json,sys
          from pathlib import Path
          size,digest,published = sys.argv[1:]
          manifest = {
            "schema_version":1,"status":"published",
            "app":"iOS Next","version":"1.7.1","build_version":"29",
            "bundle_identifier":"de.nicofroeba16.iosnext","min_os_version":"27.0",
            "source_repository":"Bambis-Lab/ios-next-build",
            "source_commit":"bcaedcdc622ea298e4dd20670f2b2c8aeabeacbe",
            "backend_commit":"47eda63a49f37ba21937d5ab9056852d60bc9b24",
            "acceptance_run":int(__import__("os").environ["RUN_ID"]),
            "release_tag":"v1.7.1","asset":"IOSNext.ipa",
            "ipa_size":int(size),"ipa_sha256":digest,"published_at":published,
            "rollback":{"version":"1.7.0","build_version":"28","release_tag":"v1.7.0"}
          }
          Path('release-manifests/1.7.1.json').write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          python3 -m json.tool source.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json release-manifests/1.7.1.json
          git commit -m 'release: publish verified iOS Next 1.7.1 build 29 [skip ci]'
          git push origin main
      - name: Verify actual published version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets
          git fetch origin main
          git show origin/main:source.json | python3 -c 'import json,sys; x=json.load(sys.stdin)["apps"][0]["versions"][0]; assert x["version"]=="1.7.1" and x["buildVersion"]=="29"; print("SIDESTORE_FEED_VERIFIED")'
